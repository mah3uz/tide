<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/brand/app-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="tide" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070b0a" />
    <script>
      // Before first paint, so the page never flashes the wrong theme. The
      // recorder's page is always dark. Mirrors lib/ui/theme.svelte.ts.
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('tide-theme') || 'system';
        } catch (e) {}
        var theme =
          location.pathname === '/egress-template'
            ? 'dark'
            : preference === 'light' || preference === 'dark'
              ? preference
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#070b0a' : '#e8ebe4');
      })();
    </script>
    <!--
      Link previews. The SPA serves this same page for every path, so these
      stay generic: a shared meeting link never shows its room's name. The
      image is relative because a self-hosted tide's origin isn't known here;
      tide makes it absolute (TIDE_BASE_URL) when it starts, so keep this tag
      exactly as written (ogImageTag in server/internal/httpapi/handler.go).
    -->
    <title>tide</title>
    <meta name="description" content="Simple, self-hosted video meetings." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="tide" />
    <meta property="og:title" content="tide" />
    <meta property="og:description" content="Simple, self-hosted video meetings." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A tide video meeting: one speaker in a large tile, the others around it"
    />
    <meta name="twitter:card" content="summary_large_image" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
